name: Bug
description: Something surface does wrong. Write it so an agent can reproduce it without asking.
labels: [fix]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw, including the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest component, screen or script that shows it. Use example data, never real records.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The `@mnmal-ai/surface-*` package versions you depend on.
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Terminal
      options:
        - macOS Terminal
        - iTerm2
        - Ghostty
        - WezTerm
        - kitty
        - Windows Terminal
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Log lines around the failure, if you have them.
      render: text
